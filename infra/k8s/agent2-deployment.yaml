apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent2-fit
  labels:
    app: agent2-fit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent2-fit
  template:
    metadata:
      labels:
        app: agent2-fit
    spec:
      containers:
        - name: agent2-fit
          image: myntra-agent2-fit:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: myntra-agent-secrets
          env:
            - name: PORT_AGENT2
              value: "3002"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent2-fit-service
spec:
  selector:
    app: agent2-fit
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
