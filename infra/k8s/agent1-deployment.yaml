apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent1-nudge
  labels:
    app: agent1-nudge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent1-nudge
  template:
    metadata:
      labels:
        app: agent1-nudge
    spec:
      containers:
        - name: agent1-nudge
          image: myntra-agent1-nudge:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: myntra-agent-secrets
          env:
            - name: PORT_AGENT1
              value: "3001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent1-nudge-service
spec:
  selector:
    app: agent1-nudge
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
