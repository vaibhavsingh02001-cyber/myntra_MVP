apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myntra-ai-agent-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  rules:
    - host: agent.myntra.internal
      http:
        paths:
          - path: /api/v1/nudge
            pathType: Prefix
            backend:
              service:
                name: agent1-nudge-service
                port:
                  number: 3001
          - path: /api/v1/price
            pathType: Prefix
            backend:
              service:
                name: agent1-nudge-service
                port:
                  number: 3001
          - path: /api/v1/fit
            pathType: Prefix
            backend:
              service:
                name: agent2-fit-service
                port:
                  number: 3002
          - path: /api/v1/wishlist
            pathType: Prefix
            backend:
              service:
                name: agent2-fit-service
                port:
                  number: 3002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent2-fit-service
                port:
                  number: 3002
