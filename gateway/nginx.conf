events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream services
    upstream agent1_nudge {
        server agent1-nudge:3001;
    }

    upstream agent2_fit {
        server agent2-fit:3002;
    }

    server {
        listen 3000;

        # Rate limiting zone
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
        limit_req zone=api_limit burst=20 nodelay;

        # Health check
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx"}';
        }

        # Agent 1: Smart Nudge Agent routes
        location /api/v1/nudge/ {
            proxy_pass http://agent1_nudge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/price/ {
            proxy_pass http://agent1_nudge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Agent 2: Fit-Confidence Match Agent routes
        location /api/v1/fit/ {
            proxy_pass http://agent2_fit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Wishlist routes (handled by Agent 2 enrichment)
        location /api/v1/wishlist/ {
            proxy_pass http://agent2_fit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Shared events webhook route
        location /api/v1/events/ {
            proxy_pass http://agent2_fit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
